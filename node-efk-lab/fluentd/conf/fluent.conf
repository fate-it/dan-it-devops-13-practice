<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match js_app.**>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    scheme http
    logstash_format true
    logstash_prefix node-app
    include_tag_key true
    tag_key fluent_tag

    <buffer>
      @type memory
      flush_interval 1s
    </buffer>
  </store>

  <store>
    @type stdout
  </store>
</match>
