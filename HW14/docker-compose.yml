version: '3.8'

services:
  app:
    build: .
    restart: always
    # We do not expose port to the host directly because we want users to access via nginx proxy

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - app
