apiVersion: apps/v1
kind: Deployment

metadata:
  name: random-string-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: random-string

  template:
    metadata:
      labels:
        app: random-string

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: random-string-container
          image: kuzmenkoserhii053/random-string:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8082